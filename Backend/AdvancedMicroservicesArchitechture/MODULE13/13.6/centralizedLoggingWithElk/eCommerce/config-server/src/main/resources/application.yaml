spring:
  application:
    name: config-server

  cloud:
    config:
      server:
        git:
          uri: https://github.com/umairali-bit/ecommerce-config-server
          username: umairali-bit
          password: ${GITHUB_TOKEN}
          default-label: main
          clone-on-start: true

server:
  port: 8888

eureka:
  instance:
    prefer-ip-address: true

  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/